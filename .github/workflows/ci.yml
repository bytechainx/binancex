name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt / clippy / test / package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --locked --all-targets --all-features -- -D warnings
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: cargo test --locked --all-features
        run: cargo test --locked --all-features
      - name: cargo package --locked --no-verify --offline
        run: cargo package --locked --no-verify --offline
